<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>链接已过期</title>
<style>
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
         max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem 1.25rem; margin: 1rem 0; }
  .bad { color: #b3261e; font-weight: 600; }
  a.button { display: inline-block; padding: .5rem 1.2rem; font-size: 1rem;
         background: #176f2c; color: #fff; border-radius: 6px; text-decoration: none; }
</style>
</head>
<body>
<h1>链接已过期</h1>
<div class="card">
  {% if error %}
    <p class="bad">该署名表暂时无法下载：{{ error }}</p>
  {% else %}
    <p class="bad">该署名表的下载链接已超过有效期，文件已被清理。</p>
  {% endif %}
  <p>请重新上传 JSON 完成核查，以获取新的下载链接。</p>
  <p><a class="button" href="/">重新核查</a></p>
</div>
</body>
</html>
